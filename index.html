<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101820">
  <title>MUMU CIRCUIT · Midnight / Signal</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:#f2f6fa;font-family:"Malgun Gothic",system-ui,sans-serif}
    #shell{position:relative;width:100%;height:100%;background:#101820}
    #unity-canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
    #loading{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:radial-gradient(ellipse at 65% 30%,#213743,#101820 60%);z-index:4;padding:32px}
    .eyebrow{font-size:12px;letter-spacing:4px;color:#55e6c1}.wordmark{font-style:italic;font-size:clamp(32px,6vw,68px);font-weight:900;letter-spacing:-2px;margin:18px 0 8px}
    .sub{font-size:13px;color:#a5b4c3;letter-spacing:2px}.track{width:min(360px,75vw);height:3px;background:#2a3b47;margin-top:40px}#progress{height:100%;background:#55e6c1;width:0;transition:width .2s}
    #status{font-size:13px;color:#a5b4c3;margin-top:14px}#hint{font-size:12px;color:#a5b4c3;margin-top:36px;text-align:center;line-height:1.9}
    #fullscreen{position:absolute;right:12px;bottom:10px;z-index:2;border:1px solid #637d8d66;border-radius:3px;background:#101820cc;color:#a5b4c3;font:11px system-ui;padding:5px 8px;cursor:pointer}
    #fullscreen:hover,#fullscreen:focus-visible{color:#55e6c1;border-color:#55e6c1}
    #banner{display:none;position:absolute;top:16px;left:50%;transform:translateX(-50%);max-width:90%;padding:16px;background:#192632;color:#f2f6fa;z-index:6;border-left:3px solid #ff6185}
    @media (orientation:portrait){#hint:after{content:"\A휴대폰은 가로 화면을 권장합니다";white-space:pre;color:#55e6c1}}
  </style>
</head>
<body>
<main id="shell">
  <canvas id="unity-canvas" tabindex="0" aria-label="MUMU CIRCUIT 레이싱 게임"></canvas>
  <section id="loading" aria-live="polite">
    <div class="eyebrow">COASTAL ARCADE DRIVING</div>
    <div class="wordmark">MUMU CIRCUIT</div>
    <div class="sub">MIDNIGHT / SIGNAL</div>
    <div class="track"><div id="progress"></div></div>
    <div id="status">해안 드라이브를 준비하고 있습니다 · 0%</div>
    <div id="hint">W A S D 운전 · SHIFT 드리프트 · ESC 메뉴<br>첫 실행은 게임 파일 다운로드에 시간이 걸립니다</div>
  </section>
  <div id="banner" role="alert"></div>
  <button id="fullscreen" type="button" aria-label="전체 화면 전환">전체 화면 ⛶</button>
</main>
<script>
  var buildUrl = "Build/v53";
  const canvas = document.getElementById('unity-canvas');
  const banner = document.getElementById('banner');
  function showBanner(message,type){
    if(type==='error'){banner.textContent=message;banner.style.display='block';}
    else console.warn(message);
  }
  const config = {
    dataUrl: buildUrl + '/CoastalWorldWebPages.data.unityweb',
    frameworkUrl: buildUrl + '/CoastalWorldWebPages.framework.js.unityweb',
    codeUrl: buildUrl + '/CoastalWorldWebPages.wasm.unityweb',
    streamingAssetsUrl: 'StreamingAssets',
    companyName: 'Mumu',productName: 'MUMU CIRCUIT',productVersion: '0.1.0',
    showBanner,devicePixelRatio:Math.min(window.devicePixelRatio||1,1.5),autoSyncPersistentDataPath:true
  };
  const script=document.createElement('script');script.src=buildUrl+'/CoastalWorldWebPages.loader.js';
  script.onload=()=>createUnityInstance(canvas,config,p=>{
    document.getElementById('progress').style.width=Math.round(p*100)+'%';
    document.getElementById('status').textContent='해안 드라이브를 준비하고 있습니다 · '+Math.round(p*100)+'%';
  }).then(instance=>{
    document.getElementById('loading').hidden=true;document.getElementById('loading').style.display='none';
    document.getElementById('fullscreen').onclick=()=>instance.SetFullscreen(1);
    canvas.focus();
  }).catch(message=>showBanner(message,'error'));
  script.onerror=()=>showBanner('게임 파일을 불러오지 못했습니다. 새로고침해 주세요.','error');
  document.body.appendChild(script);
</script>
</body>
</html>
